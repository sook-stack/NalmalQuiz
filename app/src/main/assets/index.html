<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가로세로 낱말퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: stage map (10 foldable chapters × 50 원고지 tiles), large type for older eyes → play screen (board, active clue + hint strip, input dock, clue ledger; two columns on wide screens) */
:root{
  --paper:#f6f5ef;      /* page ground */
  --sheet:#fffffb;      /* cell paper */
  --rule:#3d7a5c;       /* 원고지 green rule */
  --rule-soft:#cfe0d4;
  --ink:#1d2622;        /* text */
  --ink-2:#5b6861;      /* muted text */
  --blank:#9fb0a6;      /* unused cells */
  --pen:#2b4fa3;        /* player's writing */
  --hi:#fff0b8;         /* active word */
  --hi-cell:#ffd65c;    /* active cell */
  --star:#d99a00;
  --star-off:#d5d9d3;
  --ok:#2f7d4f;
  --bad:#c0392b;
  --bad-bg:#fbe3df;
  --reveal:#8a5a00;
  --f-display:'Gowun Batang','Nanum Myeongjo',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a17;--sheet:#2b3731;--rule:#6fb58f;--rule-soft:#2d3d34;--ink:#e8eee9;--ink-2:#9aaba1;
  --blank:#080b0a;--pen:#9dbcff;--hi:#3d3a22;--hi-cell:#7a6516;--star:#ffcf4a;--star-off:#3f4b45;
  --ok:#6fcf97;--bad:#ff8a7a;--bad-bg:#4a2320;--reveal:#f0c060;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a17;--sheet:#2b3731;--rule:#6fb58f;--rule-soft:#2d3d34;--ink:#e8eee9;--ink-2:#9aaba1;
  --blank:#080b0a;--pen:#9dbcff;--hi:#3d3a22;--hi-cell:#7a6516;--star:#ffcf4a;--star-off:#3f4b45;
  --ok:#6fcf97;--bad:#ff8a7a;--bad-bg:#4a2320;--reveal:#f0c060;color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.55;padding:0 16px}
h1{font-family:var(--f-display);font-weight:700;font-size:2rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-size:.8rem;font-weight:500;color:var(--ink-2);letter-spacing:.06em}
.btn{font:600 1.05rem var(--f-body);border-radius:12px;padding:14px 16px;min-height:56px;cursor:pointer;border:1.5px solid var(--rule);background:var(--sheet);color:var(--rule)}
.btn.primary{background:var(--rule);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tile:focus-visible,.clue-list li:focus-visible,.back:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.stars{color:var(--star);letter-spacing:.05em;white-space:nowrap}
.stars .off{color:var(--star-off)}

/* ---------- stage map ---------- */
.home{max-width:620px;margin:0 auto;padding-block:18px 48px;display:grid;gap:22px}
.summary{display:grid;gap:8px;background:var(--sheet);border:1.5px solid var(--rule);border-radius:12px;padding:14px 16px}
.summary-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.summary-row b{font-family:var(--f-display);font-size:1.5rem}
.continue{font-size:1.25rem;min-height:68px}
.bar{height:12px;border-radius:99px;background:var(--rule-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rule);border-radius:99px}
.chapter{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet)}
.chapter summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.chapter summary::-webkit-details-marker{display:none}
.chapter summary .t{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--rule)}
.chapter summary .s{grid-column:1;font-size:.9rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chapter summary .arrow{grid-row:1/3;grid-column:2;font-size:1.4rem;color:var(--rule);transition:transform .15s}
.chapter[open] summary .arrow{transform:rotate(90deg)}
.chapter summary:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:12px}
.chapter .tiles{padding:0 12px 14px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);cursor:pointer;padding:2px;font:inherit}
.tile .num{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1}
.tile .stars{font-size:.8rem}
.tile.locked{background:var(--rule-soft);border-color:var(--rule-soft);color:var(--ink-2);cursor:default}
.tile.locked .num{color:var(--ink-2);opacity:.6}
.tile.next{background:var(--hi);box-shadow:0 0 0 3px var(--hi-cell)}
.tile .go{font-size:.8rem;font-weight:600;color:var(--rule)}
.free{display:grid;gap:8px}
.free h2{font-family:var(--f-display);font-size:1.3rem;margin:0;color:var(--rule)}
.free p{margin:0;font-size:.95rem;color:var(--ink-2)}
.free .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

/* ---------- play ---------- */
.wrap{max-width:980px;margin:0 auto;padding-block:12px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:860px){.wrap{grid-template-columns:minmax(0,480px) minmax(0,1fr);align-items:start}.top{grid-column:1/-1}}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
.back{border:1.5px solid var(--rule);background:var(--sheet);color:var(--rule);font:600 1.05rem var(--f-body);cursor:pointer;padding:10px 14px;border-radius:12px;min-height:52px}
.stage-name{font-family:var(--f-display);font-weight:700;font-size:1.55rem;line-height:1.2}
.stage-name small{display:block;font-family:var(--f-body);font-size:.85rem;font-weight:500;color:var(--ink-2)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stat{font-variant-numeric:tabular-nums;font-size:1rem;color:var(--ink-2);padding:0 4px}
.stat b{color:var(--ink);font-weight:600}

.play{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.board-wrap{overflow-x:auto;overflow-y:hidden;max-width:100%;-webkit-overflow-scrolling:touch}
.board{--cell:40px;display:grid;background:var(--rule);border:2px solid var(--rule);gap:1px;user-select:none;touch-action:manipulation;margin:0 auto;width:max-content}
.cell{position:relative;width:var(--cell);height:var(--cell);min-width:0;overflow:hidden;background:var(--sheet);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:700;color:var(--pen);font-size:calc(var(--cell) * .6);cursor:pointer;padding:0;border:0}
.cell.x{background:var(--blank);cursor:default}
.cell .no{position:absolute;top:1px;left:2px;font:600 max(10px, calc(var(--cell) * .24)) var(--f-body);color:var(--ink-2);line-height:1}
.cell.inword{background:var(--hi)}
.cell.cur{background:var(--hi-cell)}
.cell.rev{color:var(--reveal)}
.cell.wrong{background:var(--bad-bg);color:var(--bad)}
.cell.done{color:var(--ok)}
.cell:focus-visible{outline:3px solid var(--pen);outline-offset:-3px}

.clue-now{display:flex;align-items:stretch;gap:6px;background:var(--sheet);border:2px solid var(--rule);border-radius:12px;padding:10px 6px}
.clue-now .nav{border:0;background:transparent;color:var(--rule);font-size:2rem;padding:0 8px;min-width:44px;cursor:pointer;border-radius:6px}
.clue-now .nav:hover{background:var(--rule-soft)}
.clue-txt{flex:1;min-width:0;display:grid;gap:2px}
.clue-tag{font-size:.95rem;font-weight:600;color:var(--rule);letter-spacing:.04em}
.clue-body{font-size:1.3rem;font-weight:600;line-height:1.45}
.clue-hint{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{font-size:1.05rem;border-radius:99px;padding:3px 12px;background:var(--hi);color:var(--ink);border:1px solid var(--hi-cell)}
.chip b{font-weight:600;color:var(--reveal);margin-right:4px}
.chip.cho{font-family:var(--f-display);font-weight:700;letter-spacing:.12em}

.dock{display:flex;gap:8px}
.dock input{flex:1;min-width:0;font:700 1.5rem var(--f-display);padding:10px 14px;min-height:60px;border:2px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink)}
.dock input:focus{outline:3px solid var(--rule-soft);border-color:var(--rule)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{font:700 1.45rem var(--f-display);letter-spacing:.04em;min-height:64px;border-radius:12px;border:2px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;padding:8px 6px;line-height:1.2}
.choice:hover{background:var(--rule-soft)}
.choice:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.choice.no{border-color:var(--bad);color:var(--bad);background:var(--bad-bg);text-decoration:line-through;cursor:default}
.choice.yes{border-color:var(--ok);background:var(--ok);color:var(--sheet)}
.choices-note{grid-column:1/-1;text-align:center;font-size:1.1rem;color:var(--ok);font-weight:600;padding:12px 0}
.choices-help{grid-column:1/-1;font-size:.95rem;color:var(--ink-2);margin:0}
@media (prefers-reduced-motion:no-preference){.choice.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tools .btn{padding:10px 4px;font-size:1rem;line-height:1.25}
.tools .btn small{display:block;font-size:.8rem;font-weight:500;opacity:.8}
.toast{min-height:1.4em;font-size:1.05rem;font-weight:500;color:var(--ink-2);text-align:center}
.confirm{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:1.05rem;background:var(--hi);border-radius:12px;padding:10px}

.ledger{display:grid;gap:16px;min-width:0}
@media (min-width:520px) and (max-width:859px){.ledger{grid-template-columns:1fr 1fr}}
.ledger h2{font-family:var(--f-display);font-size:1.35rem;margin:0 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--rule);color:var(--rule)}
.clue-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.clue-list li{display:grid;grid-template-columns:2em 1fr;gap:6px;padding:10px 8px;font-size:1.1rem;border-radius:6px;cursor:pointer}
.clue-list li:hover{background:var(--rule-soft)}
.clue-list li.on{background:var(--hi)}
.clue-list li.solved .t{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--ok)}
.clue-list .n{font-weight:600;color:var(--rule);font-variant-numeric:tabular-nums}
.clue-list .len{color:var(--ink-2);font-size:.8em;white-space:nowrap}
.clue-list .hint{color:var(--reveal);font-size:.8em;white-space:nowrap}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{background:var(--sheet);color:var(--ink);border:2px solid var(--rule);border-radius:14px;padding:22px 20px;max-width:380px;max-height:100%;overflow:auto;width:100%;text-align:center;display:grid;gap:10px}
.card h3{font-family:var(--f-display);font-size:1.8rem;margin:0;color:var(--rule)}
.big-stars{font-size:3.2rem;line-height:1;display:flex;justify-content:center;gap:6px}
.big-stars span{color:var(--star-off)}
.big-stars span.on{color:var(--star)}
.card dl{display:grid;grid-template-columns:auto auto;justify-content:center;gap:4px 14px;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.card dt{color:var(--ink-2)}.card dd{margin:0;font-weight:600;text-align:left}
.card .rule{font-size:.9rem;color:var(--ink-2);margin:0}
.card .actions{display:grid;gap:6px}
.unlock{font-weight:600;color:var(--ok);margin:0}
@media (prefers-reduced-motion:no-preference){
  .cell{transition:background-color .12s}
  .big-stars span.on{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
  .big-stars span:nth-child(2).on{animation-delay:.18s}
  .big-stars span:nth-child(3).on{animation-delay:.36s}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>


<!-- ============ 스테이지 지도 ============ -->
<main class="home" id="home">
  <h1>가로세로 낱말퀴즈<small>스테이지를 하나씩 깨고 별을 모으세요</small></h1>
  <button type="button" class="btn primary continue" id="continueBtn">스테이지 1 시작하기</button>
  <div class="summary">
    <div class="summary-row"><span>모은 별</span><b id="sumStars">0 / 1500</b></div>
    <div class="bar" aria-hidden="true"><i id="sumBar" style="width:0%"></i></div>
    <div class="summary-row"><span class="stat">깬 스테이지 <b id="sumCleared">0</b></span><span class="stat">별 3개 = 힌트 없이 완성</span></div>
  </div>
  <div id="chapters" style="display:grid;gap:12px"></div>
  <section class="free">
    <h2>자유 모드</h2>
    <p>매번 새로 만들어지는 퍼즐. 기록만 남고 별은 없어요.</p>
    <div class="row">
      <button type="button" class="btn" data-free="easy">쉬움</button>
      <button type="button" class="btn" data-free="normal">보통</button>
      <button type="button" class="btn" data-free="hard">어려움</button>
    </div>
  </section>
</main>

<!-- ============ 게임 화면 ============ -->
<div class="wrap" id="game" hidden>
  <header class="top">
    <div class="top-left">
      <button type="button" class="back" id="backBtn">‹ 목록</button>
      <div class="stage-name" id="stageName"></div>
    </div>
    <div class="meta">
      <span class="stat">시간 <b id="timer">00:00</b></span>
      <span class="stat">예상 <b class="stars" id="liveStars"></b></span>
    </div>
  </header>

  <section class="play">
    <div class="board-wrap" id="boardWrap"><div class="board" id="board" role="grid" aria-label="퍼즐 판"></div></div>

    <div class="clue-now">
      <button type="button" class="nav" id="prevBtn" aria-label="이전 문제">‹</button>
      <div class="clue-txt">
        <div class="clue-tag" id="clueTag"></div>
        <div class="clue-body" id="clueBody"></div>
        <div class="clue-hint" id="clueHint"></div>
      </div>
      <button type="button" class="nav" id="nextBtn" aria-label="다음 문제">›</button>
    </div>

    <div class="choices" id="choices" role="group" aria-label="정답 고르기"></div>

    <form class="dock" id="dock" autocomplete="off" hidden>
      <input id="answer" type="text" inputmode="text" lang="ko" placeholder="정답을 입력하세요" aria-label="정답 입력">
      <button type="submit" class="btn primary">입력</button>
    </form>

    <div class="tools">
      <button type="button" class="btn" id="hintBtn">힌트</button>
      <button type="button" class="btn" id="letterBtn">한 글자 공개<small>+3점</small></button>
      <button type="button" class="btn" id="revealBtn">정답 보기<small>+5점</small></button>
      <button type="button" class="btn" id="zoomBtn">판 크게</button>
      <button type="button" class="btn" id="modeBtn">키보드로<small>직접 입력</small></button>
      <button type="button" class="btn" id="skipBtn">다음 문제 ›</button>
      <button type="button" class="btn" id="checkBtn" hidden>채점</button>
    </div>
    <div class="confirm" id="confirmBox" hidden>
      <span id="confirmMsg"></span>
      <button type="button" class="btn primary" id="confirmYes">예</button>
      <button type="button" class="btn" id="confirmNo">아니요</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>

  <section class="ledger">
    <div><h2>가로 열쇠</h2><ol class="clue-list" id="listH"></ol></div>
    <div><h2>세로 열쇠</h2><ol class="clue-list" id="listV"></ol></div>
  </section>
</div>

<div class="overlay" id="doneBox" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <h3 id="doneTitle">완성!</h3>
    <div class="big-stars" id="doneStars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
    <p class="unlock" id="doneUnlock" hidden></p>
    <dl>
      <dt>걸린 시간</dt><dd id="dTime"></dd>
      <dt>힌트 점수</dt><dd id="dHints"></dd>
      <dt>최고 기록</dt><dd id="dBest"></dd>
    </dl>
    <p class="rule" id="doneRule">힌트 점수 0 → ★★★ · 1~6 → ★★ · 7 이상 → ★<br>(잘못 고르면 1점)</p>
    <div class="actions">
      <button type="button" class="btn primary" id="nextStageBtn">다음 스테이지</button>
      <button type="button" class="btn" id="retryBtn">다시 도전</button>
      <button type="button" class="btn" id="toMapBtn">스테이지 목록</button>
    </div>
  </div>
</div>

<script>
const WORD_BANK_RAW = `
사과|과일|빨갛고 둥근 과일, 잘못을 비는 일과 소리가 같다
사자|동물|백수의 왕이라 불리는 갈기 달린 맹수
사진|생활용품|카메라로 찍어 남긴 장면
사전|학용품|낱말의 뜻을 풀이해 모아 놓은 책
사랑|생각·행동|아끼고 소중히 여기는 마음
사람|인물|두 발로 걷고 말을 하는 존재
사계절|때·시기|봄, 여름, 가을, 겨울을 통틀어 이르는 말
사다리|생활용품|높은 곳에 오를 때 딛고 올라가는 기구
사장|직업|회사를 대표하는 우두머리
사탕|음식|입에 넣고 녹여 먹는 달콤한 과자
자동차|탈것|엔진으로 바퀴를 굴려 도로를 달리는 탈것
자전거|탈것|페달을 밟아 움직이는 두 바퀴 탈것
자석|생활용품|쇠붙이를 끌어당기는 물체
자유|생각·행동|남에게 얽매이지 않고 마음대로 하는 상태
자연|생활·사회|산, 강, 바다처럼 사람이 만들지 않은 세계
자리|생활·사회|앉거나 서 있는 곳
자장면|음식|춘장 소스에 비벼 먹는 중국식 면 요리
기차|탈것|철로 위를 여러 칸이 이어져 달리는 탈것
기린|동물|목이 아주 긴 초식 동물
기자|직업|취재해서 기사를 쓰는 사람
기억|생각·행동|지난 일을 잊지 않고 떠올리는 것
기타|악기|여섯 줄을 튕겨 연주하는 현악기
기도|생각·행동|신에게 바라는 바를 비는 일

const WORD_BANK = (() => {
  const seen = new Set();
  const out = [];
  for (const line of WORD_BANK_RAW.split('\n')) {
    const parts = line.split('|').map(x => x.trim());
    if (parts.length < 2 || !parts[0]) continue;
    // 형식: 단어|분류|힌트  (분류를 생략하고 단어|힌트 로 써도 됨)
    const [w, cat, clue] = parts.length >= 3 ? parts : [parts[0], '', parts[1]];
    if (seen.has(w)) continue;
    seen.add(w);
    out.push({ w, s: Array.from(w), cat, clue });
  }
  return out;
})();

let SUBSET = 0.8;   // 판마다 사전의 80%만 사용
const SIZE = 11;   // 모든 판은 11×11
const LEVELS = {
  easy:   { label: '쉬움',   target: 12, max: SIZE, size: SIZE },
  normal: { label: '보통',   target: 17, max: SIZE, size: SIZE },
  hard:   { label: '어려움', target: 22, max: SIZE, size: SIZE },
};

// 같은 시드면 항상 같은 퍼즐이 나오도록 하는 난수 생성기
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = Math.random;

// 스테이지 설정: 50개씩 한 장(章), 장이 오를수록 단어가 많아진다. 판은 모두 11×11
const CHAPTERS = ['새싹', '떡잎', '줄기', '꽃봉오리', '꽃', '열매', '단풍', '낙엽', '첫눈', '정상'];
const PER_CHAPTER = 50;
const STAGE_COUNT = CHAPTERS.length * PER_CHAPTER;   // 500
function stageConfig(n) {
  const ch = Math.floor((n - 1) / PER_CHAPTER);      // 0..9
  const step = (n - 1) % PER_CHAPTER;                // 0..49
  const target = 12 + ch + (step >= 25 ? 1 : 0);     // 12 → 22 단어 (장마다 +1, 장 후반 +1)
  return { max: SIZE, size: SIZE, target, seed: 1000 + n * 7919, chapter: ch, step };
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildOnce(bank, target, max, frame) {
  const cells = new Map();          // "r,c" -> { ch, h, v }
  const byChar = new Map();         // ch -> Set of "r,c"
  const placed = [];
  const used = new Set();
  let b = null;                     // bounds
  const key = (r, c) => r + ',' + c;
  const get = (r, c) => cells.get(key(r, c));

  function check(s, r, c, dir, first) {
    const dr = dir === 'v' ? 1 : 0, dc = dir === 'h' ? 1 : 0, L = s.length;
    if (get(r - dr, c - dc) || get(r + dr * L, c + dc * L)) return -1;
    let cross = 0;
    for (let i = 0; i < L; i++) {
      const rr = r + dr * i, cc = c + dc * i, cell = get(rr, cc);
      if (cell) {
        if (cell.ch !== s[i] || cell[dir]) return -1;
        cross++;
      } else if (get(rr + dc, cc + dr) || get(rr - dc, cc - dr)) {
        return -1;
      }
    }
    if (!first && (cross === 0 || cross === L)) return -1;
    if (frame) {
      // 고정 판: 0..frame-1 안에만 놓는다
      const r2 = r + dr * (L - 1), c2 = c + dc * (L - 1);
      if (r < 0 || c < 0 || r2 >= frame || c2 >= frame) return -1;
      return cross * 10 + rand() * 8;   // 교차 우선, 나머지는 무작위로 고르게
    }
    if (b) {
      const r2 = r + dr * (L - 1), c2 = c + dc * (L - 1);
      const h = Math.max(b.r1, r2) - Math.min(b.r0, r) + 1;
      const w = Math.max(b.c1, c2) - Math.min(b.c0, c) + 1;
      if (h > max || w > max) return -1;
      return cross * 10 - (h * w) / 20;   // 교차 우선, 그다음 촘촘하게
    }
    return cross;
  }

  function place(entry, r, c, dir) {
    const dr = dir === 'v' ? 1 : 0, dc = dir === 'h' ? 1 : 0, s = entry.s;
    for (let i = 0; i < s.length; i++) {
      const rr = r + dr * i, cc = c + dc * i, k = key(rr, cc);
      let cell = cells.get(k);
      if (!cell) {
        cell = { ch: s[i], h: false, v: false };
        cells.set(k, cell);
        if (!byChar.has(s[i])) byChar.set(s[i], new Set());
        byChar.get(s[i]).add(k);
      }
      cell[dir] = true;
    }
    const r2 = r + dr * (s.length - 1), c2 = c + dc * (s.length - 1);
    b = b ? { r0: Math.min(b.r0, r), r1: Math.max(b.r1, r2), c0: Math.min(b.c0, c), c1: Math.max(b.c1, c2) }
          : { r0: r, r1: r2, c0: c, c1: c2 };
    placed.push({ entry, r, c, dir });
    used.add(entry.w);
  }

  // 판마다 단어 사전의 일부만 써서 스테이지마다 단어가 고르게 바뀌도록
  const pool = shuffle(bank.slice()).slice(0, frame ? Math.max(300, Math.floor(bank.length * SUBSET)) : bank.length);
  const first = pool.find(e => e.s.length >= 3 && e.s.length <= Math.min(4, max));
  if (frame) {
    const d = rand() < 0.5 ? 'h' : 'v', mid = Math.floor(frame / 2), off = Math.floor((frame - first.s.length) / 2);
    place(first, d === 'h' ? mid : off, d === 'h' ? off : mid, d);
  } else {
    place(first, 0, 0, rand() < 0.5 ? 'h' : 'v');
  }

  while (placed.length < target) {
    let best = [], bestScore = -Infinity;
    for (const e of pool) {
      if (used.has(e.w) || e.s.length > max) continue;
      for (let i = 0; i < e.s.length; i++) {
        const spots = byChar.get(e.s[i]);
        if (!spots) continue;
        for (const k of spots) {
          const [r, c] = k.split(',').map(Number);
          const cell = cells.get(k);
          for (const dir of ['h', 'v']) {
            if (cell[dir]) continue;
            const r0 = dir === 'v' ? r - i : r, c0 = dir === 'h' ? c - i : c;
            const sc = check(e.s, r0, c0, dir, false);
            if (sc < 0) continue;
            if (sc > bestScore + 0.001) { bestScore = sc; best = [[e, r0, c0, dir]]; }
            else if (Math.abs(sc - bestScore) <= 0.001) best.push([e, r0, c0, dir]);
          }
        }
      }
    }
    if (!best.length) break;
    const pick = best[Math.floor(rand() * best.length)];
    place(...pick);
  }
  return { placed, b };
}

// opts: { target, max, seed? }  seed가 있으면 항상 같은 퍼즐
function generatePuzzle(opts, bank = WORD_BANK) {
  const { target, max, seed, size } = typeof opts === 'string' ? LEVELS[opts] : opts;
  rand = seed != null ? makeRng(seed) : Math.random;
  let best = null, bestScore = -1;
  for (let attempt = 0; attempt < 60; attempt++) {
    const res = buildOnce(bank, target, max, size);
    const score = res.placed.length;
    if (score > bestScore) { best = res; bestScore = score; }
    if (score >= target) break;
  }
  return finalize(best, size);
}

function finalize({ placed, b }, size) {
  const rows = size || b.r1 - b.r0 + 1, cols = size || b.c1 - b.c0 + 1;
  if (size) b = { r0: 0, c0: 0 };   // 고정 판은 좌표가 이미 0..size-1
  const sol = Array.from({ length: rows }, () => Array(cols).fill(null));
  const words = placed.map(p => ({
    r: p.r - b.r0, c: p.c - b.c0, dir: p.dir,
    answer: p.entry.s, text: p.entry.w, clue: p.entry.clue, cat: p.entry.cat,
  }));
  for (const w of words) {
    w.answer.forEach((ch, i) => {
      const r = w.r + (w.dir === 'v' ? i : 0), c = w.c + (w.dir === 'h' ? i : 0);
      sol[r][c] = ch;
    });
  }
  // standard numbering: row-major, one number per starting cell
  const nums = Array.from({ length: rows }, () => Array(cols).fill(0));
  let n = 0;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const starts = words.filter(w => w.r === r && w.c === c);
    if (starts.length) { n++; nums[r][c] = n; starts.forEach(w => (w.num = n)); }
  }
  words.sort((a, b) => a.num - b.num || (a.dir === 'h' ? -1 : 1));
  words.forEach((w, i) => (w.id = i));
  return { rows, cols, sol, nums, words };
}

// 초성 추출: 사과 → ㅅㄱ
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function choseong(chars) {
  return chars.map(ch => {
    const code = ch.charCodeAt(0) - 0xAC00;
    return code >= 0 && code < 11172 ? CHO[Math.floor(code / 588)] : ch;
  }).join(' ');
}

function cellsOf(w) {
  return w.answer.map((_, i) => [w.r + (w.dir === 'v' ? i : 0), w.c + (w.dir === 'h' ? i : 0)]);
}

      const nums = Array.from({ length: PER_CHAPTER }, (_, i) => first + i);
      const got = nums.reduce((a, n) => a + (P.stars[n] || 0), 0);
      const done = nums.filter(n => P.stars[n]).length;
      const c0 = stageConfig(first), c1 = stageConfig(last);
      const locked = first > open;
      sec.innerHTML = `<summary><span class="t">${ch + 1}장 · ${name}</span><span class="arrow" aria-hidden="true">›</span>
        <span class="s">스테이지 ${first}~${last} · 단어 ${c0.target}~${c1.target}개<br>${locked ? '잠김' : `깬 스테이지 ${done}/${PER_CHAPTER} · ★ ${got}/${PER_CHAPTER * 3}`}</span></summary><div class="tiles"></div>`;
      const tiles = sec.querySelector('.tiles');
      let built = false;
      const build = () => { if (built) return; built = true; nums.forEach(n => {
        const t = document.createElement('button');
        t.type = 'button';
        const locked = n > open;
        t.className = 'tile' + (locked ? ' locked' : '') + (n === open && !P.stars[n] ? ' next' : '');
        t.disabled = locked;
        const st = P.stars[n];
        t.innerHTML = `<span class="num">${n}</span>` +
          (locked ? '<span class="go">잠김</span>'
            : st ? `<span class="stars">${starStr(st)}</span>`
            : '<span class="go">도전!</span>');
        t.setAttribute('aria-label', `스테이지 ${n}` + (locked ? ' 잠김' : st ? ` 별 ${st}개` : ' 도전 가능'));
        if (!locked) t.addEventListener('click', () => openStage(n));
        tiles.appendChild(t);
      }); };
      sec.addEventListener('toggle', () => { if (sec.open) build(); });
      if (ch === openCh) { sec.open = true; build(); }
      box.appendChild(sec);
    });
    window.scrollTo(0, 0);
  }

  /* ---------------- 게임 시작 ---------------- */
  function freshState(mode, key, puz) {
    return {
      mode, key, puz,
      fill: puz.sol.map(row => row.map(() => '')),
      v: VERSION, rev: [], hintLv: {}, pts: 0, elapsed: 0, done: false,
      active: { r: puz.words[0].r, c: puz.words[0].c, dir: puz.words[0].dir },
    };
  }

  function openStage(n) {
    const saved = store.get('cw-play');
    if (saved && saved.v === VERSION && saved.mode === 'stage' && saved.key === n && !saved.done && saved.puz) S = saved;
    else S = freshState('stage', n, generatePuzzle(stageConfig(n)));
    enterGame();
  }

  function openFree(level) {
    const saved = store.get('cw-play');
    if (saved && saved.v === VERSION && saved.mode === 'free' && saved.key === level && !saved.done && saved.puz) S = saved;
    else S = freshState('free', level, generatePuzzle(level));
    enterGame();
  }

  function enterGame() {
    wrong.clear();
    $('home').hidden = true;
    $('game').hidden = false;
    $('doneBox').hidden = true;
    hideConfirm();
    if (S.mode === 'stage') {
      const cfg = stageConfig(S.key);
      $('stageName').innerHTML = `스테이지 ${S.key}<small>${cfg.chapter + 1}장 · ${CHAPTERS[cfg.chapter]} · 단어 ${S.puz.words.length}개</small>`;
    } else {
      $('stageName').innerHTML = `자유 모드<small>${LEVELS[S.key].label} · 단어 ${S.puz.words.length}개</small>`;
    }
    setupBoard();
    render();
    startTimer();
    save();
    window.scrollTo(0, 0);
  }

  function setupBoard() {
    const { puz } = S;
    wordAt = puz.sol.map(row => row.map(() => ({})));
    puz.words.forEach(w => cellsOf(w).forEach(([r, c]) => (wordAt[r][c][w.dir] = w.id)));
    const board = $('board');
    board.style.gridTemplateColumns = `repeat(${puz.cols}, var(--cell))`;
    applyZoom();
    board.innerHTML = '';
    for (let r = 0; r < puz.rows; r++) for (let c = 0; c < puz.cols; c++) {
      const el = document.createElement(puz.sol[r][c] ? 'button' : 'div');
      el.className = 'cell' + (puz.sol[r][c] ? '' : ' x');
      el.dataset.r = r; el.dataset.c = c;
      if (puz.sol[r][c]) {
        el.type = 'button';
        el.setAttribute('role', 'gridcell');
        el.addEventListener('click', () => tapCell(r, c));
      }
      board.appendChild(el);
    }
    buildLists();
  }

  function buildLists() {
    for (const dir of ['h', 'v']) {
      const ol = $(dir === 'h' ? 'listH' : 'listV');
      ol.innerHTML = '';
      S.puz.words.filter(w => w.dir === dir).forEach(w => {
        const li = document.createElement('li');
        li.tabIndex = 0;
        li.dataset.id = w.id;
        li.innerHTML = `<span class="n">${w.num}</span><span class="t"><span class="c"></span> <span class="len">(${w.answer.length}글자)</span> <span class="hint"></span></span>`;
        li.querySelector('.c').textContent = w.clue;
        const go = () => { selectWord(w); if (inputMode === 'keyboard') $('answer').focus({ preventScroll: true }); };
        li.addEventListener('click', go);
        li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
        ol.appendChild(li);
      });
    }
  }

  /* ---------------- 상태 도우미 ---------------- */
  const activeWord = () => {
    const { r, c, dir } = S.active;
    const id = wordAt[r][c][dir] ?? wordAt[r][c][dir === 'h' ? 'v' : 'h'];
    return S.puz.words[id];
  };
  const isRev = (r, c) => S.rev.includes(K(r, c));
  const wordSolved = w => cellsOf(w).every(([r, c]) => S.fill[r][c] === S.puz.sol[r][c]);
  const hintText = w => {
    const lv = S.hintLv[w.id] || 0, out = [];
    if (lv >= 1 && w.cat) out.push(w.cat);
    if (lv >= 2) out.push(choseong(w.answer));
    return out;
  };

  function selectWord(w) { S.active = { r: w.r, c: w.c, dir: w.dir }; render(); }

  function tapCell(r, c) {
    if (S.done) return;
    const a = S.active, here = wordAt[r][c];
    if (a.r === r && a.c === c && here.h != null && here.v != null) a.dir = a.dir === 'h' ? 'v' : 'h';
    else S.active = { r, c, dir: here[a.dir] != null ? a.dir : (here.h != null ? 'h' : 'v') };
    render();
    if (inputMode === 'keyboard') $('answer').focus({ preventScroll: true });
  }

  // 보기 만들기: 정답 1개 + 같은 글자 수의 다른 단어 (같은 분류를 조금 섞어 헷갈리게)
  function getChoices(w) {
    S.choices = S.choices || {};
    if (S.choices[w.id]) return S.choices[w.id];
    const inPuzzle = new Set(S.puz.words.map(x => x.text));
    const pool = (byLen[w.answer.length] || []).filter(e => !inPuzzle.has(e.w));
    const pickRandom = (arr, n) => { const a = arr.slice(); const out = []; while (a.length && out.length < n) out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0].w); return out; };
    const same = pickRandom(pool.filter(e => e.cat && e.cat === w.cat), 2);
    const rest = pickRandom(pool.filter(e => !same.includes(e.w)), CHOICE_COUNT - 1 - same.length);
    const list = [w.text, ...same, ...rest];
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
    S.choices[w.id] = list;
    return list;
  }

  function renderChoices(w, solved) {
    const box = $('choices');
    box.hidden = inputMode !== 'choice';
    $('dock').hidden = inputMode !== 'keyboard';
    $('modeBtn').innerHTML = inputMode === 'choice' ? '키보드로<small>직접 입력</small>' : '보기에서<small>고르기</small>';
    $('skipBtn').hidden = inputMode !== 'choice';
    $('checkBtn').hidden = inputMode !== 'keyboard';
    if (inputMode !== 'choice') return;
    box.innerHTML = '';
    if (solved) {
      box.innerHTML = '<p class="choices-note">맞힌 단어예요. 다른 문제를 골라 주세요.</p>';
      return;
    }
    const misses = (S.miss && S.miss[w.id]) || [];
    getChoices(w).forEach(text => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice' + (misses.includes(text) ? ' no' : '');
      b.textContent = text;
      b.disabled = misses.includes(text);
      b.addEventListener('click', () => pick(w, text, b));
      box.appendChild(b);
    });
  }

  function pick(w, text, btn) {
    if (S.done || wordSolved(w)) return;
    if (text === w.text) {
      btn.classList.add('yes');
      cellsOf(w).forEach(([r, c]) => { S.fill[r][c] = S.puz.sol[r][c]; wrong.delete(K(r, c)); });
      afterChange();
      if (S.done) return;
      toast('정답이에요!');
      setTimeout(() => { if (!S.done) nextWord(1, true); }, 450);
    } else {
      S.miss = S.miss || {};
      (S.miss[w.id] = S.miss[w.id] || []).push(text);
      S.pts += 1;
      btn.classList.add('no', 'shake');
      btn.disabled = true;
      toast('아니에요. 다시 골라 보세요. (힌트 점수 +1)');
      $('liveStars').innerHTML = starStr(starsFor(S.pts));
      save();
    }
  }

  // 판 크게 보기: 칸을 52px로 키우고 판을 옆으로 밀어 볼 수 있게
  function applyZoom() {
    const cols = S.puz.cols;
    $('board').style.setProperty('--cell', zoom ? '52px'
      : `min(calc((100vw - 36px - ${cols - 1}px) / ${cols}), ${Math.floor(440 / cols)}px)`);
    $('zoomBtn').textContent = zoom ? '판 한눈에' : '판 크게';
    $('zoomBtn').setAttribute('aria-pressed', String(zoom));
  }
  function scrollToActive() {
    if (!zoom) return;
    const el = $('board').querySelector('.cell.cur');
    const wrap = $('boardWrap');
    if (el) wrap.scrollLeft = el.offsetLeft - wrap.clientWidth / 2 + el.offsetWidth / 2;
  }

  function chip(label, value, extra) {
    const s = document.createElement('span');
    s.className = 'chip' + (extra ? ' ' + extra : '');
    const b = document.createElement('b');
    b.textContent = label;
    s.append(b, value);
    return s;
  }

  /* ---------------- 그리기 ---------------- */
  function render() {
    const { puz, fill } = S;
    const w = activeWord();
    S.active.dir = w.dir;
    const inWord = new Set(cellsOf(w).map(([r, c]) => K(r, c)));
    const solvedCells = new Set();
    puz.words.forEach(x => { if (wordSolved(x)) cellsOf(x).forEach(([r, c]) => solvedCells.add(K(r, c))); });
    for (const el of $('board').children) {
      const r = +el.dataset.r, c = +el.dataset.c;
      if (!puz.sol[r][c]) continue;
      const k = K(r, c);
      el.textContent = fill[r][c];
      if (puz.nums[r][c]) {
        const n = document.createElement('span');
        n.className = 'no'; n.textContent = puz.nums[r][c];
        el.prepend(n);
      }
      el.classList.toggle('inword', inWord.has(k));
      el.classList.toggle('cur', S.active.r === r && S.active.c === c);
      el.classList.toggle('rev', isRev(r, c));
      el.classList.toggle('wrong', wrong.has(k));
      el.classList.toggle('done', solvedCells.has(k) && !isRev(r, c));
      el.setAttribute('aria-label', `${r + 1}행 ${c + 1}열 ${fill[r][c] || '빈칸'}`);
    }
    $('clueTag').textContent = `${w.dir === 'h' ? '가로' : '세로'} ${w.num} · ${w.answer.length}글자`;
    $('clueBody').textContent = w.clue;

    // 힌트 칩
    const lv = S.hintLv[w.id] || 0;
    const hb = $('clueHint');
    hb.innerHTML = '';
    if (lv >= 1 && w.cat) hb.append(chip('분류', w.cat));
    if (lv >= 2) hb.append(chip('초성', choseong(w.answer), 'cho'));

    const solved = wordSolved(w);
    const hintBtn = $('hintBtn');
    const nextLv = (lv === 0 && !w.cat) ? 2 : lv + 1;
    if (solved || lv >= 2) { hintBtn.innerHTML = solved ? '힌트' : '힌트<small>다 씀</small>'; hintBtn.disabled = true; }
    else { hintBtn.innerHTML = nextLv === 1 ? `분류 힌트<small>+${COST.cat}점</small>` : `초성 힌트<small>+${COST.cho}점</small>`; hintBtn.disabled = false; }
    $('letterBtn').disabled = solved;
    $('revealBtn').disabled = solved;
    renderChoices(w, solved);

    document.querySelectorAll('.clue-list li').forEach(li => {
      const x = puz.words[+li.dataset.id];
      li.classList.toggle('on', x.id === w.id);
      li.classList.toggle('solved', wordSolved(x));
      li.querySelector('.hint').textContent = hintText(x).map(t => '· ' + t).join(' ');
    });
    $('liveStars').innerHTML = starStr(starsFor(S.pts));
    $('timer').textContent = fmt(S.elapsed);
    scrollToActive();
  }

  function toast(msg) {
    $('toast').textContent = msg;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => ($('toast').textContent = ''), 2800);
  }

  function nextWord(step, onlyUnsolved) {
    const ws = S.puz.words, cur = activeWord().id;
    for (let i = 1; i <= ws.length; i++) {
      const w = ws[(cur + step * i + ws.length * i) % ws.length];
      if (!onlyUnsolved || !wordSolved(w)) { selectWord(w); return true; }
    }
    return false;
  }

  /* ---------------- 조작 ---------------- */
  function submit(e) {
    e.preventDefault();
    if (S.done) return;
    const w = activeWord();
    const chars = Array.from($('answer').value.replace(/\s+/g, ''));
    if (!chars.length) { toast('정답을 입력한 뒤 [입력]을 누르세요.'); return; }
    if (chars.length > w.answer.length) { toast(`${w.answer.length}글자 단어예요. 다시 입력해 주세요.`); return; }
    const locked = (r, c) => {
      const other = wordAt[r][c][w.dir === 'h' ? 'v' : 'h'];
      return isRev(r, c) || (other != null && wordSolved(S.puz.words[other]));
    };
    cellsOf(w).forEach(([r, c], i) => {
      if (i < chars.length && !locked(r, c)) { S.fill[r][c] = chars[i]; wrong.delete(K(r, c)); }
    });
    $('answer').value = '';
    afterChange();
    if (S.done) return;
    if (wordSolved(w)) { toast('정답!'); nextWord(1, true); }
    else if (chars.length === w.answer.length) toast('틀린 글자가 있어요. 가로·세로가 만나는 칸을 확인해 보세요.');
    render();
  }

  function hint() {
    if (S.done) return;
    const w = activeWord();
    if (wordSolved(w)) return;
    const lv = S.hintLv[w.id] || 0;
    if (lv >= 2) return;
    const next = (lv === 0 && !w.cat) ? 2 : lv + 1;
    S.hintLv[w.id] = next;
    S.pts += next === 1 ? COST.cat : COST.cho;
    toast(next === 1 ? '분류를 알려 드렸어요. 한 번 더 누르면 초성을 알려 드려요.' : '초성을 알려 드렸어요.');
    afterChange();
  }

  // 한 글자 공개: 아직 안 맞은 칸 중 하나를 채운다 (가로·세로가 만나는 칸을 먼저)
  function revealLetter() {
    if (S.done) return;
    const w = activeWord();
    const cands = cellsOf(w).filter(([r, c]) => S.fill[r][c] !== S.puz.sol[r][c]);
    if (!cands.length) { toast('이 단어는 이미 맞았어요.'); return; }
    const other = w.dir === 'h' ? 'v' : 'h';
    const cross = cands.filter(([r, c]) => wordAt[r][c][other] != null);
    const [r, c] = (cross.length ? cross : cands)[0];
    S.fill[r][c] = S.puz.sol[r][c];
    S.rev.push(K(r, c)); wrong.delete(K(r, c));
    S.pts += COST.letter;
    toast(`한 글자를 채웠어요. 힌트 점수 +${COST.letter}`);
    afterChange();
  }

  function clearWord() {
    if (S.done) return;
    const w = activeWord();
    cellsOf(w).forEach(([r, c]) => {
      const other = wordAt[r][c][w.dir === 'h' ? 'v' : 'h'];
      const keep = isRev(r, c) || (other != null && wordSolved(S.puz.words[other]));
      if (!keep) { S.fill[r][c] = ''; wrong.delete(K(r, c)); }
    });
    afterChange();
  }

  function check() {
    if (S.done) return;
    wrong.clear();
    let empty = 0;
    S.puz.sol.forEach((row, r) => row.forEach((ch, c) => {
      if (!ch) return;
      if (!S.fill[r][c]) empty++;
      else if (S.fill[r][c] !== ch) wrong.add(K(r, c));
    }));
    toast(wrong.size ? `틀린 칸 ${wrong.size}개를 빨갛게 표시했어요.` : `틀린 칸은 없어요. 빈칸이 ${empty}개 남았어요.`);
    render();
  }

  function revealWord() {
    const w = activeWord();
    cellsOf(w).forEach(([r, c]) => {
      if (S.fill[r][c] !== S.puz.sol[r][c]) { S.fill[r][c] = S.puz.sol[r][c]; S.rev.push(K(r, c)); wrong.delete(K(r, c)); }
    });
    S.pts += COST.reveal;
    afterChange();
  }

  function askConfirm(msg, fn) { pending = fn; $('confirmMsg').textContent = msg; $('confirmBox').hidden = false; }
  function hideConfirm() { pending = null; $('confirmBox').hidden = true; }

  function afterChange() {
    if (!S.done && S.puz.words.every(wordSolved)) finish();
    render();
    save();
  }

  /* ---------------- 완성 ---------------- */
  function finish() {
    S.done = true;
    stopTimer();
    const stars = starsFor(S.pts);
    let bestTxt, unlockTxt = '';
    if (S.mode === 'stage') {
      const n = S.key;
      const firstClear = !P.stars[n];
      P.stars[n] = Math.max(P.stars[n] || 0, stars);
      const prevBest = P.best[n];
      const isBest = prevBest == null || S.elapsed < prevBest;
      if (isBest) P.best[n] = S.elapsed;
      bestTxt = isBest ? `${fmt(S.elapsed)} (신기록)` : fmt(prevBest);
      store.set('cw-progress', P);
      if (firstClear && n < STAGE_COUNT) {
        unlockTxt = (n % PER_CHAPTER === 0) ? `새 장이 열렸어요: ${n / PER_CHAPTER + 1}장 · ${CHAPTERS[n / PER_CHAPTER]}` : '다음 스테이지가 열렸어요!';
      }
      if (firstClear && n === STAGE_COUNT) unlockTxt = '모든 스테이지를 깼어요! 이제 별 3개에 도전해 보세요.';
      $('doneTitle').textContent = `스테이지 ${n} 완성!`;
      $('nextStageBtn').hidden = n >= STAGE_COUNT;
      $('nextStageBtn').textContent = '다음 스테이지 ›';
      $('doneStars').hidden = false;
      $('doneRule').hidden = false;
    } else {
      const bk = 'cw-best-' + S.key;
      const best = store.get(bk);
      const isBest = best == null || S.elapsed < best;
      if (isBest) store.set(bk, S.elapsed);
      bestTxt = isBest ? `${fmt(S.elapsed)} (신기록)` : fmt(best);
      $('doneTitle').textContent = '완성!';
      $('nextStageBtn').hidden = false;
      $('nextStageBtn').textContent = '새 퍼즐';
      $('doneStars').hidden = true;
      $('doneRule').hidden = true;
    }
    [...$('doneStars').children].forEach((s, i) => s.classList.toggle('on', i < stars));
    $('doneUnlock').textContent = unlockTxt;
    $('doneUnlock').hidden = !unlockTxt;
    $('dTime').textContent = fmt(S.elapsed);
    $('dHints').textContent = S.pts ? `${S.pts}점` : '0점 (힌트 없음)';
    $('dBest').textContent = bestTxt;
    $('doneBox').hidden = false;
    ($('nextStageBtn').hidden ? $('retryBtn') : $('nextStageBtn')).focus();
  }

  function startTimer() {
    stopTimer();
    if (S.done) return;
    tick = setInterval(() => {
      if (document.hidden || S.done || $('game').hidden) return;
      S.elapsed++;
      $('timer').textContent = fmt(S.elapsed);
      if (S.elapsed % 5 === 0) save();
    }, 1000);
  }
  function stopTimer() { if (tick) clearInterval(tick); tick = null; }
  function save() { if (S) store.set('cw-play', S); }

  /* ---------------- 연결 ---------------- */
  $('dock').addEventListener('submit', submit);
  $('hintBtn').addEventListener('click', hint);
  $('letterBtn').addEventListener('click', revealLetter);
  $('zoomBtn').addEventListener('click', () => { zoom = !zoom; store.set('cw-zoom', zoom); applyZoom(); scrollToActive(); });
  $('modeBtn').addEventListener('click', () => {
    inputMode = inputMode === 'choice' ? 'keyboard' : 'choice';
    store.set('cw-input', inputMode);
    render();
    if (inputMode === 'keyboard') $('answer').focus({ preventScroll: true });
  });
  $('skipBtn').addEventListener('click', () => { if (!nextWord(1, true)) nextWord(1, false); });
  $('checkBtn').addEventListener('click', check);
  $('revealBtn').addEventListener('click', () => {
    if (S.done) return;
    const w = activeWord();
    if (wordSolved(w)) { toast('이 단어는 이미 맞았어요.'); return; }
    askConfirm(`${w.num}번 ${w.dir === 'h' ? '가로' : '세로'} 정답을 볼까요? 힌트 점수 +${COST.reveal}`, revealWord);
  });
  $('confirmYes').addEventListener('click', () => { const fn = pending; hideConfirm(); fn && fn(); });
  $('confirmNo').addEventListener('click', hideConfirm);
  $('prevBtn').addEventListener('click', () => nextWord(-1, false));
  $('nextBtn').addEventListener('click', () => nextWord(1, false));
  $('backBtn').addEventListener('click', showHome);
  $('toMapBtn').addEventListener('click', showHome);
  $('retryBtn').addEventListener('click', () => {
    S = S.mode === 'stage'
      ? freshState('stage', S.key, generatePuzzle(stageConfig(S.key)))
      : freshState('free', S.key, generatePuzzle(S.key));
    enterGame();
  });
  $('nextStageBtn').addEventListener('click', () => {
    if (S.mode === 'stage') openStage(S.key + 1);
    else { S = freshState('free', S.key, generatePuzzle(S.key)); enterGame(); }
  });
  document.querySelectorAll('[data-free]').forEach(b => b.addEventListener('click', () => openFree(b.dataset.free)));

  function start(data) {
    if (data && data.P) P = data.P;
    if (data && data.S && data.S.v === VERSION && data.screen === 'game') { S = data.S; enterGame(); }
    else showHome();
  }
  window.claude?.hot?.snapshot?.(() => ({ S, P, screen: $('game').hidden ? 'home' : 'game' }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();

</script>

</body>
</html>
